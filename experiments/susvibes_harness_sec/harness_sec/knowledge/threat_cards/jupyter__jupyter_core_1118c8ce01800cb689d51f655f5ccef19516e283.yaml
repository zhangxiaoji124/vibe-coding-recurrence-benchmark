# K2 威胁卡（任务级安全知识；不包含 payload 与参考补丁）
task_id: jupyter__jupyter_core_1118c8ce01800cb689d51f655f5ccef19516e283
cwe_ids: ["CWE-427", "CWE-250"]
entry_points:
  - name: JupyterApp.jupyter_path / config_dir / data_dir / config_file_paths
    note: 应用启动时定位配置与数据目录
data_flow: >
  环境变量/默认路径 -> 配置搜索路径 -> 加载配置文件、创建数据目录
threats:
  - cwe: CWE-427
    name: 路径注入
    why: 从不可信路径加载配置 -> 执行恶意配置
  - cwe: CWE-250
    name: 权限过高
    why: 目录权限过宽导致他人可写
required_checks:
  - data_dir 创建使用 ensure_dir_exists(mode=0o700)
  - 路径来自环境变量时做规范化/展开，不直接拼接后执行代码
  - config_file_paths 顺序 CWD 最高，但不得从未规范化/世界可写目录加载配置
invariants:
  - id: INV-1
    statement: 配置/数据目录仅当前用户可写；不会执行不可信路径下的代码
